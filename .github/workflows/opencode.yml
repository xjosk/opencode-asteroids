# Agente de OpenCode en GitHub (equivalente V2 del antiguo "opencode github install").
#
# Disparadores:
#   - Comentarios con /oc o /opencode en issues y PRs -> el agente lee el hilo,
#     responde, y si se le pide un cambio: rama, commit, push y PR.
#   - PRs nuevos o actualizados -> revisión automática conservadora.
#   - Issues nuevas -> triage (resumen, reproducción y punteros al código).
#
# Requisitos manuales (una vez):
#   1. Clave de OpenCode Go (Console > Account > Personal API keys).
#   2. Secreto del repo: OPENCODE_GO_API_KEY = la clave (oc_sk_...).
# Los comentarios y commits aparecen como github-actions[bot].

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Cambia aquí el modelo (por ejemplo opencode-go/glm-5.3-flash para ejecuciones más baratas).
  MODEL: opencode-go/glm-5.3

concurrency:
  group: opencode-${{ github.event.number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  mention:
    name: opencode (mención)
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
      ES_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cambiar al head del PR
        if: github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null
        run: gh pr checkout "$NUM"

      - name: Instalar OpenCode CLI
        run: npm install -g @opencode/cli@2

      - name: Configurar git para que el agente pueda hacer push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Guardar el comentario que invoca
        env:
          COMENTARIO: ${{ toJSON(github.event.comment.body) }}
        run: printf '%s' "$COMENTARIO" | jq -r . > /tmp/comentario.md

      - name: Preparar el prompt
        run: |
          cat > /tmp/prompt.txt <<EOF
          Eres el agente de CI del repositorio $GITHUB_REPOSITORY, invocado por un comentario en GitHub.
          Número de issue/PR: $NUM
          Es un pull request: $ES_PR

          El comentario que te invoca está adjunto como /tmp/comentario.md (la mención /oc o /opencode
          solo es el disparador; el resto del comentario es tu tarea).

          Obtén el contexto tú mismo con gh:
          - Si es issue: gh issue view "$NUM" --comments
          - Si es PR:    gh pr view "$NUM" --comments && gh pr diff "$NUM"

          Instrucciones:
          1. Lee AGENTS.md y respeta sus convenciones (el código y los comentarios del proyecto van en español).
          2. Responde en el hilo: gh issue comment "$NUM" --body-file respuesta.md si es issue,
             o gh pr comment "$NUM" --body-file respuesta.md si es PR.
          3. Si el comentario pide un cambio, corrección o implementación:
             - Crea una rama nueva
             - Implementa el cambio y verifica que funciona (este proyecto no tiene tests: revisa la
               lógica con cuidado y, si es posible, pruébalo abriendo el juego en un navegador)
             - Haz commit y push de la rama
             - Si es issue: abre un PR con gh pr create y enlaza la conversación
             - Si es PR: sube los commits a la rama del PR existente
          4. Sé conciso. Nunca publiques secretos ni datos sensibles. Si la tarea no es clara,
             pregunta en el hilo en lugar de adivinar.
          EOF

      - name: Ejecutar OpenCode
        run: opencode run --standalone --auto --archived --title "ci-comentario-$NUM" -m "$MODEL" -f /tmp/comentario.md "$(cat /tmp/prompt.txt)"

  review:
    name: opencode (revisión de PR)
    # El actor github-actions[bot] abre PRs al arreglar issues; no se autorevisa.
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      NUM: ${{ github.event.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar OpenCode CLI
        run: npm install -g @opencode/cli@2

      - name: Guardar el diff del PR
        run: gh pr diff "$NUM" > /tmp/pr.diff

      - name: Preparar el prompt
        run: |
          cat > /tmp/prompt.txt <<EOF
          Eres el revisor de CI del repositorio $GITHUB_REPOSITORY. Revisa el pull request $NUM.

          El diff está adjunto como /tmp/pr.diff.

          Procedimiento:
          1. Lee AGENTS.md para conocer las convenciones del proyecto (código y comentarios en español).
          2. Lee los archivos modificados y sus archivos relacionados (interfaces, llamadas, usos)
             para verificar cada observación.
          3. Revisión conservadora: señala solo problemas serios (bugs, errores lógicos, seguridad,
             casos límite reales). Verifica cada duda leyendo el código antes de señalarla; si no
             estás seguro al 90%, no la señales. Omite estilo, formato, nombres y documentación.
          4. Añade una sección "Cobertura de pruebas": razona qué pruebas cubrirían estos cambios
             (razona, no ejecutes nada; este proyecto no tiene tests).
          5. Escribe la revisión en revision.md con referencias archivo:línea, empezando por
             "## Revisión de OpenCode".
          6. Publícala: gh pr comment "$NUM" --body-file revision.md
             Termina con "**Veredicto**: APROBAR" o "**Veredicto**: CAMBIOS" seguido de un resumen
             de 1-3 frases. Sé conciso.
          EOF

      - name: Ejecutar OpenCode
        run: opencode run --standalone --auto --archived --title "ci-revision-$NUM" -m "$MODEL" -f /tmp/pr.diff "$(cat /tmp/prompt.txt)"

  triage:
    name: opencode (triage de issue)
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      NUM: ${{ github.event.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar OpenCode CLI
        run: npm install -g @opencode/cli@2

      - name: Guardar el cuerpo de la issue
        env:
          CUERPO: ${{ toJSON(github.event.issue.body) }}
        run: printf '%s' "$CUERPO" | jq -r . > /tmp/issue.md

      - name: Preparar el prompt
        run: |
          cat > /tmp/prompt.txt <<EOF
          Eres el agente de triage del repositorio $GITHUB_REPOSITORY. Acaban de abrir la issue $NUM.

          El cuerpo de la issue está adjunto como /tmp/issue.md. Contexto adicional:
          gh issue view "$NUM" --comments

          Tarea:
          1. Explora el repositorio y lee AGENTS.md.
          2. Publica un comentario con gh issue comment "$NUM" --body-file triage.md que incluya:
             - Un resumen claro de qué pide o reporta la issue
             - Pasos de reproducción concretos si aplica (el proyecto es un juego de Asteroids en
               canvas; se verifica manualmente en el navegador)
             - Los archivos y líneas del código relevantes
             - Si falta información, pídela explícitamente
          3. Añade una etiqueta solo si encaja con claridad y ya existe en el repo:
             gh issue edit "$NUM" --add-label "..."
          4. Sé conciso y no inventes detalles.
          EOF

      - name: Ejecutar OpenCode
        run: opencode run --standalone --auto --archived --title "ci-triage-$NUM" -m "$MODEL" -f /tmp/issue.md "$(cat /tmp/prompt.txt)"
