# Agente de OpenCode en GitHub (equivalente V2 del antiguo "opencode github install").
#
# Disparador: únicamente comentarios con /oc o /opencode en issues y PRs
# (conversación del PR o comentarios en líneas de código del PR).
# El agente lee el hilo, responde, y si se le pide un cambio:
# rama, commit, push y PR. No hay triage automático de issues
# ni revisión automática de PRs.
#
# Requisitos manuales (una vez):
#   1. Clave de OpenCode Go (Console > Account > Personal API keys).
#   2. Secreto del repo: OPENCODE_GO_API_KEY = la clave (oc_sk_...).
# Los comentarios y commits aparecen como github-actions[bot].
# Nota: cada comentario crea un run informativo; los que no llevan la
# mención quedan como "Skipped" en 0s y no consumen minutos de runner.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Cambia aquí el modelo (por ejemplo opencode-go/glm-5.3-flash para ejecuciones más baratas).
  MODEL: opencode-go/glm-5.3

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  mention:
    name: opencode (mención)
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
      ES_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cambiar al head del PR
        if: github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null
        run: gh pr checkout "$NUM"

      - name: Instalar OpenCode CLI
        run: npm install -g @opencode/cli@2

      - name: Configurar git para que el agente pueda hacer push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Guardar el comentario que invoca
        env:
          COMENTARIO: ${{ toJSON(github.event.comment.body) }}
        run: printf '%s' "$COMENTARIO" | jq -r . > /tmp/comentario.md

      - name: Preparar el prompt
        run: |
          cat > /tmp/prompt.txt <<EOF
          Eres el agente de CI del repositorio $GITHUB_REPOSITORY, invocado por un comentario en GitHub.
          Número de issue/PR: $NUM
          Es un pull request: $ES_PR

          El comentario que te invoca está adjunto como /tmp/comentario.md (la mención /oc o /opencode
          solo es el disparador; el resto del comentario es tu tarea).

          Obtén el contexto tú mismo con gh:
          - Si es issue: gh issue view "$NUM" --comments
          - Si es PR:    gh pr view "$NUM" --comments && gh pr diff "$NUM"

          Instrucciones:
          1. Lee AGENTS.md y respeta sus convenciones (el código y los comentarios del proyecto van en español).
          2. Responde en el hilo: gh issue comment "$NUM" --body-file respuesta.md si es issue,
             o gh pr comment "$NUM" --body-file respuesta.md si es PR.
          3. Si el comentario pide un cambio, corrección o implementación:
             - Crea una rama nueva
             - Implementa el cambio y verifica que funciona (este proyecto no tiene tests: revisa la
               lógica con cuidado y, si es posible, pruébalo abriendo el juego en un navegador)
             - Haz commit y push de la rama
             - Si es issue: abre un PR con gh pr create y enlaza la conversación
             - Si es PR: sube los commits a la rama del PR existente
          4. Sé conciso. Nunca publiques secretos ni datos sensibles. Si la tarea no es clara,
             pregunta en el hilo en lugar de adivinar.
          EOF

      - name: Ejecutar OpenCode
        run: opencode run --standalone --auto --archived --title "ci-comentario-$NUM" -m "$MODEL" -f /tmp/comentario.md "$(cat /tmp/prompt.txt)"
