# Agente de triage de issues: cuando se crea un issue nuevo, un agente de
# OpenCode (modelo económico de pago) lo clasifica, reescribe el cuerpo con
# secciones —conservando el texto original byte a byte— y añade etiquetas
# estándar (bug, enhancement, question, documentation). Silencioso: solo
# edita cuerpo y etiquetas, no publica comentarios en el hilo.
#
# Requisitos manuales (una vez): secreto del repo OPENCODE_GO_API_KEY,
# el mismo que usa .github/workflows/opencode.yml.
name: Formatear issues nuevos (agente)

on:
  issues:
    types: [opened]

# Permisos mínimos: lectura para el checkout y escritura sobre issues.
permissions:
  contents: read
  issues: write

# Nunca dos ejecuciones simultáneas sobre el mismo issue.
concurrency:
  group: formato-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # Modelo económico de pago (USD por millón de tokens: 0.15 entrada / 0.50 salida).
  # Cambia aquí si quieres otro modelo.
  MODEL: opencode-go/glm-5.3-flash

jobs:
  formatear:
    name: Clasificar, formatear y etiquetar (agente)
    # Se ignoran los issues creados por bots.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Guardar el issue (título, cuerpo y etiquetas)
        run: gh issue view "$NUM" --json number,title,body,author,labels > /tmp/issue.json

      - name: Instalar OpenCode CLI
        run: npm install -g @opencode/cli@2

      - name: Preparar el prompt
        run: |
          cat > /tmp/prompt.txt <<EOF
          Eres el agente de triage del repositorio $GITHUB_REPOSITORY. Se acaba de crear
          el issue #$NUM y tu tarea es clasificarlo, formatearlo y extraer sus puntos
          importantes. El issue completo (número, título, cuerpo y etiquetas) está en
          /tmp/issue.json.

          Instrucciones:
          1. Lee /tmp/issue.json. Si el cuerpo ya contiene el marcador
             <!-- auto-issue-formatter -->, NO hagas nada más: el issue ya fue
             procesado y se respeta su formato actual.
          2. Clasifica el issue SOLO entre estas etiquetas estándar de GitHub:
             bug, enhancement, question, documentation. Puedes asignar varias o
             ninguna si nada encaja con confianza.
          3. Redacta en español (mira AGENTS.md para las convenciones del proyecto):
             - Resumen: 1–2 líneas con lo que el issue pide o reporta.
             - Puntos clave: lista con lo importante (pasos de reproducción,
               mensajes de error, bloques de código, archivos mencionados,
               enlaces, requisitos).
             - Clasificación: tabla con cada etiqueta asignada y su motivo breve.
          4. Escribe /tmp/cuerpo-nuevo.md con EXACTAMENTE esta estructura Markdown
             (respeta el marcador, los encabezados y su orden; el contenido entre
             paréntesis es lo que tú redactas):

             <!-- auto-issue-formatter -->
             ## 📝 Descripción original

             (el cuerpo original del issue, BYTE A BYTE, sin blockquote ni ningún
             retoque; si el issue no traía cuerpo, escribe exactamente:
             _El issue no incluía descripción al crearse._)

             ## 🎯 Resumen

             (tu resumen de 1–2 líneas)

             ## 🔍 Puntos clave

             - (punto importante 1)
             - (punto importante 2)

             ## 🏷️ Clasificación

             | Etiqueta | Motivo |
             | --- | --- |
             | (etiqueta) | (motivo breve) |

             Si no asignaste ninguna etiqueta, en la sección Clasificación escribe
             exactamente: _Ninguna etiqueta superó el umbral de confianza._
          5. Aplica los cambios en una sola llamada de gh (nunca quites etiquetas
             existentes ni añadas otras fuera de las cuatro permitidas; omite los
             flags de etiqueta si no detectaste ninguna):

             gh issue edit "$NUM" --body-file /tmp/cuerpo-nuevo.md --add-label "bug" ...

          6. No publiques comentarios en el hilo. No alteres el texto original ni
             inventes información que no esté en el issue. No hagas commits, push
             ni toques el código del repositorio: tu única salida es la edición
             del issue. Sé preciso, conciso y nunca publiques secretos ni datos
             sensibles.
          EOF

      - name: Ejecutar OpenCode
        run: opencode run --standalone --auto --archived --title "ci-issue-$NUM" -m "$MODEL" "$(cat /tmp/prompt.txt)"
